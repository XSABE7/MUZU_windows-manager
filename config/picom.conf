# MUZUwm Picom Compositor Configuration
# Frosted Glass & Shadows

backend = "glx";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.50;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# Transparency / Opacity
active-opacity = 1.0;
inactive-opacity = 0.95;
frame-opacity = 0.90;

# Dual Kawase Blur (Frosted Glass)
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Rounded corners (where supported)
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
