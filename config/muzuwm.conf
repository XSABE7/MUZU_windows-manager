# MUZUwm Window Manager Configuration
# Modifiers: Super, Alt, Ctrl, Shift

# Optional Features (1 = enabled, 0 = disabled)
enable_alttab = 1
workspace_count = 4
focus_follows_mouse = 1
enable_desktop_menu = 1

# Window Focus Borders
border_width = 2
focus_border_color = #89b4fa
unfocus_border_color = #45475a

# Workspaces
Super+Ctrl+1 = workspace_1
Super+Ctrl+2 = workspace_2
Super+Ctrl+3 = workspace_3
Super+Ctrl+4 = workspace_4
Super+Shift+1 = move_workspace_1
Super+Shift+2 = move_workspace_2
Super+Shift+3 = move_workspace_3
Super+Shift+4 = move_workspace_4
Super+Page_Up = workspace_prev
Super+Page_Down = workspace_next

# Window Management
Super+Left = tile_left
Super+Right = tile_right
Super+Up = fullscreen
Super+Down = float
Super+q = close_window
Super+m = fullscreen
Super+z = minimize

# App Launching
Super+Return = exec wezterm start --always-new-process || alacritty || xterm
Super+b = exec x-www-browser || firefox || google-chrome
